
plugins {
    id 'com.android.application'
}

android {
    namespace 'app.lovable.luckyvpnmaster'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "app.lovable.luckyvpnmaster"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        aidl = true
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    
    // Google Play Services for Ads
    implementation 'com.google.android.gms:play-services-ads:22.6.0'

    // Embedded OpenVPN (no separate app install needed) — Apache-2.0
    implementation 'io.github.tim06:openvpn:1.1.3'
    implementation 'io.github.tim06:basevpnprotocols:1.1.1'

    // WireGuard: temporarily disabled (tunnel AAR fails D8 dexing on this
    // toolchain — "Record desugaring without global-synthetics consumer").
    // TODO: re-enable with newer AGP or alternative integration.
    // implementation 'com.wireguard.android:tunnel:1.0.20230706'

    // Force cached AndroidX versions (proxy blocks some dl.google.com downloads)
    constraints {
        implementation('androidx.core:core-ktx:1.16.0') { because 'cached locally' }
    }
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
