services:
  - type: web
    name: lucky-vpn-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PORT
        value: 3306
      - key: DB_HOST
        sync: false # TiDB Cloud host, e.g. xxx.tidbcloud.com
      - key: DB_NAME
        value: test
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true # Render generates a random secret
      - key: SYNC_CRON
        value: on # auto VPNGate sync every 6h (set "off" to disable)
      - key: FRONTEND_URL
        value: ""
